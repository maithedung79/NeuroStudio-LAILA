name: Application checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.8'
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build frontend
        working-directory: apps/web
        run: npm run build

      - name: Sync Python engine and dev dependencies
        run: uv sync --extra engine --extra dev --locked

      - name: Lint Python with Ruff
        run: uv run --no-sync ruff check src tests

      - name: Run Backend test suite
        run: uv run --no-sync pytest -v

      - name: Verify CLI entrypoint
        run: uv run --no-sync neurostudio --help

      - name: Build Python wheel
        run: uv build --wheel
